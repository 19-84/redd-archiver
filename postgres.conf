# ABOUTME: PostgreSQL configuration for the redd-archiver Docker postgres service
# ABOUTME: Tuned for bulk-import (COPY) + read-heavy archive serving workloads

listen_addresses = '*'
max_connections = 100

# --- Memory ---------------------------------------------------------------
# Sized for a dedicated container on a >=4GB host; scale shared_buffers /
# effective_cache_size up proportionally on bigger machines.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 32MB                   # per sort/hash node; queries avoid big SQL sorts
maintenance_work_mem = 512MB      # index builds outside the import path
                                  # (bulk import sets 4GB per-session itself)

# --- Write-ahead log / checkpoints -----------------------------------------
# Bulk COPY at 15K+ rows/sec generates WAL far faster than the 1GB default
# max_wal_size allows between checkpoints, causing checkpoint storms that
# throttle imports. Spread checkpoints out and compress WAL instead.
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Planner ---------------------------------------------------------------
# Archive data is served from SSD/NVMe (or cache) in typical deployments;
# the spinning-disk default of 4.0 makes the planner avoid good index scans.
random_page_cost = 1.1
