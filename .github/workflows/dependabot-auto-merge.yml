name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs. GitHub then merges each PR
# automatically once all required status checks (configured in the main
# branch protection rule) pass. PRs that fail CI are never merged.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        # Auto-merges every green Dependabot PR. To hold major-version bumps
        # for manual review instead, add this guard to the step:
        #   if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
